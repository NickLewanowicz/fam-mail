version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind 4 is a planned migration (ADR 0001 Phase 2) — upgrade deliberately
      - dependency-name: "tailwindcss"
        versions: [">=4"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
