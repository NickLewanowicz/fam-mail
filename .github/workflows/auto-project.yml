name: Auto-add to Project Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add to Fammail Features board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/NickLewanowicz/projects/4
          github-token: ${{ secrets.PROJECT_TOKEN }}
