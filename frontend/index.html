<!doctype html>
<html lang="en" data-theme="fammail">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const t = localStorage.getItem('fam_mail_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'fammail-dark';
        } else {
          document.documentElement.dataset.theme = 'fammail';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/envelope.svg" />
    <meta name="theme-color" content="#3B1D1E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fam Mail - Send Postcards to Friends & Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
