<!doctype html>
<html lang="en" data-theme="fammail">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const t = localStorage.getItem('fam_mail_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'fammail-dark';
        } else {
          document.documentElement.dataset.theme = 'fammail';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fam Mail - Send Postcards to Friends & Family</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
